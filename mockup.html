<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CraveCraft — 3D Studio Laptop Reel Mockup (9:16)</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="Cinematic 9:16 angled laptop reel mockup showcasing CraveCraft 3D food website on a dark walnut studio desk.">
  <meta name="author" content="Gampa Sai Charan">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">

  <!-- Google Fonts: Inter, Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

  <!-- GSAP Pinned from cdnjs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    /* ======================================================================
       3D STUDIO LAPTOP REEL (9:16 FORMAT) STYLING
       ====================================================================== */
    :root {
      --deep-bg: #070605;
      --desk-dark: #120b07;
      --desk-light: #2c1a11;
      --gold: #D9A441;
      --cream: #F6F1EA;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030302;
      font-family: 'Inter', sans-serif;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Outer Wrapper scales the 9:16 frame to fit current viewport */
    .viewport-scaler {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    /* 9:16 Aspect Ratio Stage (1080 x 1920 design coordinate space) */
    .reel-stage {
      position: relative;
      width: min(100%, 540px);
      aspect-ratio: 9 / 16;
      max-height: 96vh;
      background: radial-gradient(circle at 50% 28%, #1f1610 0%, #0d0906 50%, #040302 100%);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 30px 100px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(255, 255, 255, 0.08);
      perspective: 1600px;
    }

    /* Dark Walnut Wooden Desk at Bottom */
    .studio-desk {
      position: absolute;
      bottom: 0;
      left: -20%;
      width: 140%;
      height: 48%;
      background: linear-gradient(180deg, 
        rgba(56, 34, 21, 0.95) 0%, 
        rgba(34, 20, 13, 0.98) 25%, 
        #120a07 60%, 
        #070403 100%
      );
      transform: rotateX(55deg);
      transform-origin: bottom center;
      box-shadow: inset 0 2px 10px rgba(255, 255, 255, 0.08);
      border-top: 2px solid rgba(217, 164, 65, 0.2);
      pointer-events: none;
    }

    /* Wood grain planks simulation */
    .studio-desk::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        transparent,
        transparent 60px,
        rgba(0, 0, 0, 0.25) 60px,
        rgba(0, 0, 0, 0.25) 62px
      );
      opacity: 0.6;
    }

    /* Dramatic Studio Overhead Spotlights */
    .studio-spotlight {
      position: absolute;
      top: -15%;
      left: 50%;
      transform: translateX(-50%);
      width: 120%;
      height: 65%;
      background: radial-gradient(ellipse at center, rgba(217, 164, 65, 0.15) 0%, rgba(217, 164, 65, 0.04) 45%, transparent 75%);
      pointer-events: none;
      filter: blur(35px);
    }

    /* Cinematic Vignette */
    .studio-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 40%, rgba(0, 0, 0, 0.85) 100%);
      pointer-events: none;
      z-index: 10;
    }

    /* ----------------------------------------------------------------------
       REALISTIC 3D ANGLED LAPTOP SYSTEM
       ---------------------------------------------------------------------- */
    .laptop-3d-scene {
      position: absolute;
      top: 24%;
      left: 50%;
      transform: translate(-50%, -20%) rotateX(13deg) rotateY(-7deg) rotateZ(1deg);
      transform-style: preserve-3d;
      width: 92%;
      max-width: 490px;
      aspect-ratio: 16 / 10;
      will-change: transform, opacity;
      z-index: 5;
    }

    /* Contact Shadow beneath Laptop */
    .laptop-shadow {
      position: absolute;
      bottom: -60px;
      left: 2%;
      width: 96%;
      height: 70px;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.5) 45%, transparent 75%);
      filter: blur(12px);
      transform: rotateX(70deg) translateZ(-40px);
      pointer-events: none;
    }

    /* Laptop Screen Lid */
    .laptop-lid {
      position: relative;
      width: 100%;
      height: 100%;
      background: #1e1e20;
      border: 3px solid #2d2d32;
      border-radius: 12px 12px 2px 2px;
      box-shadow: 
        0 0 0 1px rgba(255, 255, 255, 0.12),
        0 25px 60px rgba(0, 0, 0, 0.9),
        inset 0 1px 1px rgba(255, 255, 255, 0.2);
      overflow: hidden;
      transform-style: preserve-3d;
      display: flex;
      flex-direction: column;
    }

    /* Webcam Notch / Dot */
    .laptop-webcam-bezel {
      width: 100%;
      height: 14px;
      background: #111113;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    .webcam-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #1f3b2b;
      box-shadow: 0 0 2px #34d399;
    }

    /* Live Screen Frame running index.html */
    .laptop-screen-viewport {
      position: relative;
      flex: 1;
      width: 100%;
      background: #0B0907;
      overflow: hidden;
    }

    .laptop-iframe {
      width: 133.33%;
      height: 133.33%;
      transform: scale(0.75);
      transform-origin: top left;
      border: none;
      background: #0B0907;
    }

    /* Screen Glass Diagonal Reflection */
    .screen-glass-glare {
      position: absolute;
      inset: 0;
      background: linear-gradient(130deg, 
        rgba(255, 255, 255, 0.12) 0%, 
        rgba(255, 255, 255, 0.03) 28%, 
        transparent 50%
      );
      pointer-events: none;
      z-index: 3;
    }

    /* Laptop Lower Keyboard Base Deck */
    .laptop-base-deck {
      position: absolute;
      top: 98%;
      left: -4%;
      width: 108%;
      height: 180px;
      background: linear-gradient(180deg, #2a2a2e 0%, #1a1a1c 45%, #0f0f10 100%);
      transform: rotateX(68deg);
      transform-origin: top center;
      border-radius: 0 0 16px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 10px;
    }

    /* Keyboard Well Silhouette */
    .keyboard-recess {
      width: 84%;
      height: 90px;
      background: #111113;
      border-radius: 4px;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.05);
      opacity: 0.65;
    }

    /* Trackpad */
    .trackpad-cutout {
      width: 28%;
      height: 48px;
      margin-top: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.02);
    }

    /* ----------------------------------------------------------------------
       OVERLAY UI: TOP-RIGHT INSTAGRAM GLYPH & CENTERING END-CARD
       ---------------------------------------------------------------------- */
    /* Top-right Instagram Watermark Glyph */
    .top-instagram-glyph {
      position: absolute;
      top: 32px;
      right: 32px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background: rgba(18, 14, 11, 0.6);
      backdrop-filter: blur(10px);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(217, 164, 65, 0.3);
    }

    .top-instagram-glyph svg {
      width: 16px;
      height: 16px;
      stroke: var(--gold);
    }

    /* Centered Instagram Outro End-Card */
    .instagram-endcard {
      position: absolute;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      z-index: 25;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 85%;
    }

    .ig-icon-wrapper {
      width: 80px;
      height: 80px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      margin-bottom: 22px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
      transition: background 0.8s ease, transform 0.8s ease;
    }

    .ig-icon-wrapper svg {
      width: 44px;
      height: 44px;
      stroke: #000000;
      transition: stroke 0.6s ease;
    }

    .ig-handle-text {
      font-size: clamp(1.6rem, 3.8vw, 2.3rem);
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #FFFFFF;
      margin-bottom: 8px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
      font-family: 'Inter', sans-serif;
    }

    .ig-sub-text {
      font-size: 0.85rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 600;
      margin-bottom: 24px;
    }

    .ig-founder-meta {
      font-size: 0.75rem;
      color: rgba(246, 241, 234, 0.6);
      letter-spacing: 0.08em;
    }

    /* ----------------------------------------------------------------------
       HUD CONTROLS & KEYBOARD HINTS
       ---------------------------------------------------------------------- */
    .reel-hud {
      position: absolute;
      bottom: 24px;
      left: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      z-index: 30;
      transition: opacity 0.3s ease;
    }

    .hud-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hud-btn {
      padding: 8px 16px;
      background: rgba(20, 16, 13, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(217, 164, 65, 0.35);
      border-radius: 4px;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 600;
      color: var(--cream);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .hud-btn:hover {
      background: var(--gold);
      color: #000;
      border-color: var(--gold);
    }

    .hud-shortcut-hint {
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.45);
    }

    /* Clean Screen Recording mode: triggered by pressing 'H' */
    .hide-ui .reel-hud,
    .hide-ui .top-instagram-glyph {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* Exit back to full web mode button */
    .back-web-btn {
      position: absolute;
      top: 32px;
      left: 32px;
      z-index: 20;
    }
  </style>
</head>
<body>

  <div class="viewport-scaler">
    <div class="reel-stage" id="reelStage">
      <!-- Dark Walnut Wooden Desk Surface -->
      <div class="studio-desk"></div>

      <!-- Studio Dramatic Spotlights & Vignette -->
      <div class="studio-spotlight"></div>
      <div class="studio-vignette"></div>

      <!-- Top Back Button -->
      <a href="index.html" class="hud-btn back-web-btn" title="Back to Standard Website">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Web View
      </a>

      <!-- Top Right Instagram Watermark Glyph -->
      <div class="top-instagram-glyph" id="topIgGlyph">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
        <span>@__sai__8055_</span>
      </div>

      <!-- 3D Angled Laptop Scene Container -->
      <div class="laptop-3d-scene" id="laptopScene">
        <!-- Contact Shadow on Desk -->
        <div class="laptop-shadow"></div>

        <!-- Laptop Screen Lid -->
        <div class="laptop-lid">
          <div class="laptop-webcam-bezel">
            <span class="webcam-dot"></span>
          </div>

          <!-- Inside Screen: Live Website running via iframe -->
          <div class="laptop-screen-viewport">
            <iframe id="laptopScreenIframe" class="laptop-iframe" src="index.html" title="Live CraveCraft Food Website" loading="eager"></iframe>
            <div class="screen-glass-glare"></div>
          </div>
        </div>

        <!-- Laptop Lower Keyboard Base Deck -->
        <div class="laptop-base-deck">
          <div class="keyboard-recess"></div>
          <div class="trackpad-cutout"></div>
        </div>
      </div>

      <!-- Centered Outro Instagram End-Card -->
      <div class="instagram-endcard" id="instagramEndcard">
        <div class="ig-icon-wrapper" id="igIconWrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5"/>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
          </svg>
        </div>
        <h2 class="ig-handle-text">@__sai__8055_</h2>
        <p class="ig-sub-text">CRAVECRAFT • EVERY LAYER CRAFTED</p>
        <p class="ig-founder-meta">Gampa Sai Charan • B.Tech CSE (AI &amp; ML) • Creative Technologist</p>
      </div>

      <!-- Bottom HUD Controls & Hints -->
      <div class="reel-hud">
        <div class="hud-left">
          <button class="hud-btn" id="replayBtn" aria-label="Replay Reel Animation">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
            Replay (R)
          </button>
          <button class="hud-btn" id="hideUiBtn" aria-label="Toggle UI Visibility for Recording">
            Hide UI (H)
          </button>
        </div>
        <div class="hud-shortcut-hint">
          10-11s Reel Mode
        </div>
      </div>
    </div>
  </div>

  <!-- Reel Master GSAP Timeline -->
  <script>
    let reelTimeline;

    function buildReelAnimation() {
      if (reelTimeline) reelTimeline.kill();

      const laptop = document.getElementById("laptopScene");
      const topIg = document.getElementById("topIgGlyph");
      const endcard = document.getElementById("instagramEndcard");
      const igIconWrap = document.getElementById("igIconWrapper");
      const iframe = document.getElementById("laptopScreenIframe");

      // Reset iframe to guarantee fresh start of 4 dishes loop
      if (iframe) {
        iframe.src = iframe.src;
      }

      // Reset initial values
      gsap.set(laptop, {
        scale: 0.88,
        rotateX: 14,
        rotateY: -8,
        rotateZ: 1.5,
        opacity: 1,
        filter: "blur(0px)",
        y: 0
      });

      gsap.set(topIg, { opacity: 0, y: -10 });
      gsap.set(endcard, { opacity: 0, scale: 0.88 });
      gsap.set(igIconWrap, {
        background: "#FFFFFF"
      });
      const igSvg = igIconWrap.querySelector("svg");
      if (igSvg) igSvg.style.stroke = "#000000";

      // 10-11 Second Master Timeline
      reelTimeline = gsap.timeline();

      // Top Instagram watermark fades in at 1.2s
      reelTimeline.to(topIg, {
        opacity: 0.95,
        y: 0,
        duration: 0.8,
        ease: "power2.out"
      }, 1.2);

      // Slow camera dolly-in and 2-3° rotation over ~10s
      reelTimeline.to(laptop, {
        scale: 1.05,
        rotateX: 10,
        rotateY: -3,
        rotateZ: 0.5,
        y: -15,
        duration: 9.8,
        ease: "sine.inOut"
      }, 0);

      // At ~9.8s (after 4 dishes sequence finishes): laptop dims to 25% with blur
      reelTimeline.to(laptop, {
        opacity: 0.22,
        filter: "blur(5px)",
        scale: 1.02,
        duration: 0.9,
        ease: "power3.inOut"
      }, 9.6);

      // Top watermark fades out
      reelTimeline.to(topIg, {
        opacity: 0,
        duration: 0.4
      }, 9.6);

      // Centered Outro Instagram End-Card fades and scales in
      reelTimeline.to(endcard, {
        opacity: 1,
        scale: 1,
        duration: 0.8,
        ease: "back.out(1.4)"
      }, 9.9);

      // Instagram Icon color cycle: White -> Pink/Purple Gradient -> White
      // 1. Transition into Instagram Gradient
      reelTimeline.to(igIconWrap, {
        background: "linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%)",
        duration: 0.6,
        onStart: () => {
          if (igSvg) igSvg.style.stroke = "#FFFFFF";
        }
      }, 10.3);

      // 2. Pulse and settle to clean white glow
      reelTimeline.to(igIconWrap, {
        scale: 1.08,
        duration: 0.4,
        yoyo: true,
        repeat: 1,
        ease: "sine.inOut"
      }, 10.5);
    }

    // Initialize on page load
    window.addEventListener("DOMContentLoaded", () => {
      buildReelAnimation();

      // Replay button
      const replayBtn = document.getElementById("replayBtn");
      if (replayBtn) {
        replayBtn.addEventListener("click", () => buildReelAnimation());
      }

      // Hide UI button
      const hideUiBtn = document.getElementById("hideUiBtn");
      const stage = document.getElementById("reelStage");
      if (hideUiBtn && stage) {
        hideUiBtn.addEventListener("click", () => {
          stage.classList.toggle("hide-ui");
        });
      }

      // Keyboard Shortcuts: R to Replay, H to Hide UI
      window.addEventListener("keydown", (e) => {
        if (e.key === "r" || e.key === "R") {
          buildReelAnimation();
        } else if (e.key === "h" || e.key === "H") {
          if (stage) stage.classList.toggle("hide-ui");
        }
      });
    });
  </script>
</body>
</html>
